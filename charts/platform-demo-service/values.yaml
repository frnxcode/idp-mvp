appName: platform-demo-service
namespace: demo-dev
replicaCount: 1

image:
  repository: platform-demo-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

serviceAccount:
  name: platform-demo-sa
