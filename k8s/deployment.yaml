apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-demo-service
  namespace: demo-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-demo-service
  template:
    metadata:
      labels:
        app: platform-demo-service
    spec:
      serviceAccountName: platform-demo-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: platform-demo-service
          image: platform-demo-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
