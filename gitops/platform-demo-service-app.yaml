apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-demo-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/frnxcode/idp-mvp.git
    targetRevision: main
    path: charts/platform-demo-service
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
